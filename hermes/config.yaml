# Lucy — Hermes Agent profile (BODY = CẦU NỐI, không execute)
# ---------------------------------------------------------------------------
# Kiến trúc: body chỉ DISPATCH → Claude Code (qua `!c`/skill claude-code) mới thực thi.
#   • Brain body = MISTRAL FREE (1B token/tháng) để body ~$0. Đủ cho việc cầu nối.
#   • Fallback (nếu Mistral yếu/rate-limit): grok-4-1-fast-reasoning qua provider=xai + XAI_API_KEY.
#   • Đã TRIM tool + tắt reasoning + nén mạnh → cắt token (trước đó 33 tool = ~13K token/lượt → cháy tiền).
#
# 🔑 KEY: Mistral = provider=custom, mà custom KHÔNG đọc env key → đặt model.api_key TRÊN BOX:
#     hermes config set model.api_key <mistral-key>     (ghi vào ~/.hermes/config.yaml, KHÔNG commit)
#   Lấy key free: https://console.mistral.ai (La Plateforme, free tier 1B token/tháng).

model:
  provider: custom
  # Experiment free cho dùng MỌI model (1B token/tháng · 2 RPM). Chọn theo adherence+tốc độ, không theo giá.
  # Medium = sweet spot cho DISPATCHER: bám SOUL + tool-call ổn, nhanh hơn Large (đỡ nghẹt 2 RPM).
  # Lú persona → lên mistral-large-latest. Cần nhanh hơn → mistral-small-latest (Small 4).
  default: mistral-medium-latest
  base_url: https://api.mistral.ai/v1
  # api_key: <set trên box bằng `hermes config set model.api_key ...`, KHÔNG để đây>
  #
  # Fallback grok: provider=xai · default=grok-4-1-fast-reasoning · base_url=https://api.x.ai/v1 · key=XAI_API_KEY (.env)

prompt_caching:
  cache_ttl: 5m

# Nén sớm để history không phình (tiết kiệm token)
compression:
  enabled: true
  threshold: 0.4
  target_ratio: 0.2
  protect_last_n: 16
  protect_first_n: 2

# Auxiliary ghim "main" (chính endpoint trên) — KHÔNG để auto (né rơi xuống anthropic đọc ~/.claude)
auxiliary:
  compression:    { provider: main }
  web_extract:    { provider: main }
  session_search: { provider: main }

agent:
  reasoning_effort: low    # dispatcher KHÔNG cần nghĩ sâu (Claude mới nghĩ) → cắt output token
  max_turns: 10            # dispatcher chỉ cần ~vài turn (phân loại + spawn claude + tóm tắt). 40 = dễ loop cháy token.

# ⛓️ ÉP CỨNG ở tầng harness — KHÔNG trông cậy SOUL (model yếu hallucinate sẽ bỏ qua SOUL).
# Hermes TỰ ngắt mạch sau N lần fail → chặn retry-loop cháy token dù model cố retry.
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 3
    same_tool_failure: 4
    idempotent_no_progress: 4

# TRIM TOOL — ép cứng: bỏ `web` để Lucy KHÔNG thể tự research → BUỘC dispatch qua claude -p.
# (claude -p có WebSearch/WebFetch riêng. Model hallucinate cũng không có tool web để lạm dụng.)
platform_toolsets:
  telegram: [terminal, file, skills, cronjob, send_message]
  cli: [terminal, file, skills, cronjob]

# Reset phiên hằng ngày để context không tích lũy vô hạn
session_reset:
  mode: both

# ⛓️ HOOK ép luật mỗi turn (vì model yếu lờ SOUL ở đầu context → re-inject vào CUỐI, recency).
# Deploy: cp hermes/hooks/inject-rules.sh ~/.hermes/agent-hooks/ ; chmod +x nó.
hooks:
  pre_llm_call:
    - command: "~/.hermes/agent-hooks/inject-rules.sh"
hooks_auto_accept: true   # gateway non-interactive cần cái này để hook tự chạy (không hỏi consent)

# Gateway Telegram (line riêng) — token trong .env, không để đây.
