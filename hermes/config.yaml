# Lucy — Hermes Agent profile (BODY của Lucy)
# ---------------------------------------------------------------------------
# Kiến trúc (chốt 2026-06-03):
#   • THÂN (body)  = Hermes chạy model RẺ + THÔNG MINH: xai/grok-4.1-fast-reasoning,
#                    gọi THẲNG xAI (OpenAI-compatible). Luôn-bật, lo Telegram/voice/cron/máy.
#   • NÃO (brain)  = Claude Code, triệu hồi bằng command `!c <task>` → `claude -p ...`
#                    (auth OAuth riêng của Claude Code, KHÔNG phải model của Hermes).
#
#   → Đã BỎ OmniRoute (trước dùng để route Claude-OAuth; giờ Claude vào bằng subprocess
#     nên không cần router). provider=xai ⇒ Hermes KHÔNG bao giờ đi đường native Anthropic
#     ⇒ landmine credential `~/.claude` biến mất. Xem ../docs/BRIDGE_CLAUDE_CODE.md.
#
# Endpoint + key: xem ./.env.example. KHÔNG commit secret thật.

model:
  # provider=xai NATIVE (đã validate trên Windows 2026-06-03) — đọc thẳng XAI_API_KEY từ .env,
  # KHÔNG để key trong file này (repo-safe). _is_native_anthropic=False ⇒ không đụng ~/.claude.
  provider: xai
  # Brain của THÂN = grok 4.1 fast reasoning: $0.20/$0.50 per 1M, cached $0.05/M, context 2M.
  # ⚠️ Model id xAI = dấu GẠCH NGANG hết: grok-4-1-fast-reasoning (KHÔNG phải 4.1 có dấu chấm).
  # Ref: https://docs.x.ai/developers/models/grok-4-1-fast-reasoning
  default: grok-4-1-fast-reasoning
  base_url: https://api.x.ai/v1
  # Key: đặt XAI_API_KEY trong .env (xem ./.env.example). KHÔNG để api_key ở đây.
  #
  # LƯU Ý (đã học khi test): provider=custom KHÔNG đọc OPENAI_API_KEY (tự điền "not-needed" → xAI 400).
  # Dùng provider=xai (đọc XAI_API_KEY) HOẶC provider=custom + model.api_key đặt thẳng (lộ vào file).

# Bật prompt caching để giữ chi phí ~$10/năm (persona/system prompt cache còn $0.05/M).
prompt_caching:
  cache_ttl: 5m

compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3

# Auxiliary (vision/compress/web_extract/session_search): GHIM về "main" (= chính endpoint
# xAI ở trên) để KHÔNG rơi xuống native Anthropic (đường đó đọc ~/.claude → cướp OAuth Claude
# Code → 400 out of extra usage). Đừng để "auto".
auxiliary:
  compression:    { provider: main }
  web_extract:    { provider: main }
  session_search: { provider: main }
  # vision: cần model multimodal. grok fast có thể không nhận ảnh → thêm key gemini/openrouter
  # sau nếu muốn phân tích ảnh. Tạm để trống (chỉ kích hoạt khi có ảnh).

agent:
  reasoning_effort: medium
  max_turns: 60

# Gateway Telegram (line riêng Bill) — token nằm trong .env, không để đây.
# Web dashboard (hermes dashboard --host 0.0.0.0 + OAuth) cấu hình ở dashboard: / .env khi dựng.
