<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>L.U.C.Y — Hub</title>
<style>
  :root{ --bg:#04060f; --panel:#0a1020; --cyan:#3fd3ff; --pink:#ff2d7e; --txt:#cfe9ff; --dim:#6b86a8; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 "Share Tech Mono",ui-monospace,monospace;
       background-image:repeating-linear-gradient(transparent 0 2px,rgba(63,211,255,.03) 3px 4px)}
  #login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--bg)}
  .brand{font-size:30px;letter-spacing:6px;color:var(--cyan);text-shadow:0 0 12px rgba(63,211,255,.6)}
  input,textarea,button{font-family:inherit;background:var(--panel);color:var(--txt);border:1px solid rgba(63,211,255,.3);border-radius:0;padding:10px}
  input:focus,textarea:focus{outline:none;border-color:var(--cyan)}
  button{cursor:pointer;color:var(--cyan);border-color:var(--cyan)}
  button:hover{background:rgba(63,211,255,.1)}
  #app{display:none;flex-direction:column;height:100vh}
  header{padding:10px 16px;border-bottom:1px solid rgba(63,211,255,.2);display:flex;align-items:center;gap:12px}
  header .brand{font-size:18px;letter-spacing:3px}
  #log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .msg{max-width:90%;padding:10px 12px;border:1px solid rgba(63,211,255,.18);white-space:pre-wrap;word-break:break-word}
  .me{align-self:flex-end;border-color:var(--pink);color:#ffd6e6}
  .lucy{align-self:flex-start}
  .sys{align-self:center;color:var(--dim);font-size:12px;border:none}
  footer{display:flex;gap:8px;padding:12px;border-top:1px solid rgba(63,211,255,.2)}
  #inp{flex:1;resize:none;height:46px}
  label.tg{display:flex;align-items:center;gap:4px;color:var(--dim);font-size:12px}
</style>
</head>
<body>
  <div id="login">
    <div class="brand">L.U.C.Y</div>
    <div style="color:var(--dim)">Literally Understands Crypto, Y'know</div>
    <input id="pw" type="password" placeholder="mật khẩu" style="width:240px"/>
    <button onclick="doLogin()" style="width:240px">ĐĂNG NHẬP</button>
    <div id="lerr" style="color:var(--pink);font-size:12px"></div>
  </div>

  <div id="app">
    <header><span class="brand">L.U.C.Y</span><span id="status" style="color:var(--dim);font-size:12px">● online</span></header>
    <div id="log"></div>
    <footer>
      <textarea id="inp" placeholder="Nhắn Lucy… (Shift+Enter xuống dòng)"></textarea>
      <label class="tg"><input type="checkbox" id="opus" style="width:auto;padding:0"/>opus</label>
      <button onclick="sendMsg()" id="sendBtn">GỬI</button>
    </footer>
  </div>

<script>
let SESSION = null;
function add(cls, txt){ const d=document.createElement('div'); d.className='msg '+cls; d.textContent=txt;
  document.getElementById('log').appendChild(d); d.scrollIntoView(); return d; }

async function doLogin(){
  const pw=document.getElementById('pw').value;
  const r=await fetch('/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw})});
  if(r.ok){ document.getElementById('login').style.display='none'; document.getElementById('app').style.display='flex';
            document.getElementById('inp').focus(); }
  else document.getElementById('lerr').textContent='Sai mật khẩu.';
}

async function sendMsg(){
  const inp=document.getElementById('inp'); const text=inp.value.trim(); if(!text) return;
  const opus=document.getElementById('opus').checked;
  add('me', text); inp.value='';
  const ph=add('sys','🤔 Lucy đang xử lý…');
  document.getElementById('sendBtn').disabled=true;
  try{
    const r=await fetch('/api/send',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({prompt:text,opus:opus,session_id:SESSION})});
    const {job_id}=await r.json();
    const res=await poll(job_id, ph);
    ph.remove(); add('lucy', res);
  }catch(e){ ph.textContent='❌ lỗi: '+e; }
  document.getElementById('sendBtn').disabled=false; inp.focus();
}

function poll(job_id, ph){ return new Promise((resolve,reject)=>{
  const t=setInterval(async()=>{
    try{
      const r=await fetch('/api/poll/'+job_id); const j=await r.json();
      if(j.status==='done'){ clearInterval(t); if(j.session_id) SESSION=j.session_id; resolve(j.result); }
      else ph.textContent=`⏳ Lucy đang chạy (${j.model})… ${j.elapsed}s`;
    }catch(e){ clearInterval(t); reject(e); }
  },2000);
});}

document.getElementById('inp').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMsg(); } });
document.getElementById('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
// auto-skip login nếu cookie còn hạn
fetch('/api/me').then(r=>r.json()).then(j=>{ if(j.authed){ document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex'; } });
</script>
</body>
</html>
